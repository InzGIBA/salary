<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Табло зарплаты · киоск</title>
  <meta name="description" content="Киоск-режим табло зарплаты для телевизора: на весь экран, без кнопок.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0f0d">
  <noscript><meta http-equiv="refresh" content="0; url=index.html?kiosk=true"></noscript>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230c0f0d'/%3E%3Crect x='8' y='8' width='84' height='84' rx='10' fill='%23ffb020'/%3E%3Ctext x='50' y='72' font-size='60' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%230c0f0d'%3E%E2%82%B8%3C/text%3E%3C/svg%3E">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(90rem 40rem at 50% -14rem, rgb(255 176 32 / 0.14), transparent 62%),
        #0c0f0d;
      color: #ece9df;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    .boot { display: grid; justify-items: center; gap: 1.1rem; padding: 2rem; }
    .logo {
      display: grid;
      place-items: center;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 0.7rem;
      background: #ffb020;
      color: #0c0f0d;
      font-size: 2.6rem;
      font-weight: 700;
      box-shadow: 0 0 40px rgb(255 176 32 / 0.45);
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); letter-spacing: 0.08em; text-transform: uppercase; }
    .sub { margin: 0; font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: #93a099; }
    .bar { display: flex; gap: 4px; margin-top: 0.4rem; }
    .bar i {
      width: 14px;
      height: 8px;
      border-radius: 2px;
      background: rgb(255 176 32 / 0.18);
      animation: led 1.2s linear infinite;
    }
    @keyframes led {
      0%, 100% { background: rgb(255 176 32 / 0.18); box-shadow: none; }
      40% { background: #ffb020; box-shadow: 0 0 10px rgb(255 176 32 / 0.6); }
    }
    .hint { margin: 0; font-size: 0.75rem; color: #93a099; }
    a { color: #ffb020; }
    @media (prefers-reduced-motion: reduce) { .bar i { animation: none; background: #ffb020; } }
  </style>
</head>
<body>
  <main class="boot">
    <span class="logo">₸</span>
    <h1>Табло зарплаты</h1>
    <p class="sub">аэропорт «Бухгалтерия» · режим киоска</p>
    <div class="bar" aria-hidden="true">
      <i style="animation-delay:0s"></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i>
      <i style="animation-delay:.3s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.5s"></i>
      <i style="animation-delay:.6s"></i><i style="animation-delay:.7s"></i><i style="animation-delay:.8s"></i>
      <i style="animation-delay:.9s"></i><i style="animation-delay:1s"></i><i style="animation-delay:1.1s"></i>
    </div>
    <p class="hint">Переключаем табло на весь экран…</p>
    <p class="hint"><a id="manual" href="index.html?kiosk=true">Открыть табло вручную</a></p>
  </main>

  <script>
    // kiosk.html — короткий адрес для телевизора; вся логика живёт в index.html.
    var q = new URLSearchParams(location.search);
    q.set('kiosk', 'true');
    var target = 'index.html?' + q.toString();
    document.getElementById('manual').href = target;
    location.replace(target);
  </script>
</body>
</html>
